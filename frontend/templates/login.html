<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 面料用量快速计算系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .login-wrapper {
            display: flex;
            height: 100vh;
            background: #FAF8F5;
        }

        /* ========== 左侧品牌展示区 ========== */
        .brand-section {
            flex: 0 0 55%;
            position: relative;
            background: linear-gradient(135deg, #fef3e2 0%, #fce7f3 50%, #dbeafe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            overflow: hidden;
        }

        /* 布料纹理叠加 */
        .fabric-texture {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.08;
            background-image:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 69, 19, 0.03) 2px,
                    rgba(139, 69, 19, 0.03) 4px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 69, 19, 0.03) 2px,
                    rgba(139, 69, 19, 0.03) 4px
                );
            pointer-events: none;
        }

        /* 装饰性裁片图案 */
        .pattern-decoration {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
        }

        .pattern-decoration.top-right {
            top: -150px;
            right: -150px;
            animation: float 8s ease-in-out infinite;
        }

        .pattern-decoration.bottom-left {
            bottom: -200px;
            left: -200px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* CSS绘制的剪刀图标 */
        .scissors-icon {
            position: absolute;
            top: 80px;
            right: 120px;
            width: 80px;
            height: 80px;
            opacity: 0.15;
            animation: scissors-move 12s ease-in-out infinite;
        }

        @keyframes scissors-move {
            0%, 100% { transform: rotate(-15deg) translateX(0); }
            50% { transform: rotate(15deg) translateX(20px); }
        }

        /* 品牌内容 */
        .brand-content {
            position: relative;
            z-index: 10;
            max-width: 520px;
        }

        .brand-icon-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.25);
            position: relative;
            overflow: hidden;
        }

        .brand-icon-large::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.2) 50%,
                transparent 70%
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .brand-title {
            font-size: 42px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 18px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 48px;
            font-weight: 400;
        }

        /* 特性列表 */
        .features-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .feature-item:hover {
            transform: translateX(8px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .feature-icon.blue { background: #dbeafe; }
        .feature-icon.pink { background: #fce7f3; }
        .feature-icon.green { background: #d1fae5; }

        .feature-text h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .feature-text p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        /* ========== 右侧登录区 ========== */
        .login-section {
            flex: 0 0 45%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: white;
            position: relative;
        }

        /* 缝线装饰 */
        .stitch-decoration {
            position: absolute;
            left: 0;
            top: 10%;
            bottom: 10%;
            width: 3px;
            background: repeating-linear-gradient(
                to bottom,
                #d4c5b9 0px,
                #d4c5b9 8px,
                transparent 8px,
                transparent 16px
            );
            opacity: 0.4;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 15px;
            color: #94a3b8;
            font-weight: 400;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #94a3b8;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
            background: #f8fafc;
        }

        .form-input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08), 0 4px 12px rgba(59, 130, 246, 0.08);
        }

        .form-input:focus + .input-icon,
        .form-input:focus ~ .input-icon {
            color: #3b82f6;
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }

        /* 登录按钮 */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .btn-login:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* 错误提示 */
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
            animation: shake 0.5s ease-in-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 默认账号提示 */
        .default-hint {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            padding: 16px 18px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 24px;
            border-left: 4px solid #f59e0b;
            line-height: 1.6;
        }

        .default-hint strong {
            color: #78350f;
            font-weight: 700;
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 页脚 */
        .login-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: #94a3b8;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
        }

        /* 响应式适配 */
        @media (max-width: 1024px) {
            .brand-section {
                display: none;
            }
            .login-section {
                flex: 1;
            }
        }

        @media (max-width: 480px) {
            .login-section {
                padding: 30px 20px;
            }
            .brand-title {
                font-size: 32px;
            }
        }
    </style>
    <script src="/static/js/icons.js?v=20260608"></script>
</head>
<body>
    <div class="login-wrapper">
        <!-- 左侧品牌展示区 -->
        <div class="brand-section">
            <div class="fabric-texture"></div>
            <div class="pattern-decoration top-right"></div>
            <div class="pattern-decoration bottom-left"></div>

            <!-- SVG剪刀装饰 -->
            <svg class="scissors-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="8" stroke="#2563eb" stroke-width="3"/>
                <circle cx="20" cy="44" r="8" stroke="#2563eb" stroke-width="3"/>
                <path d="M26 24 L54 40 L26 40 Z" fill="#2563eb" opacity="0.3"/>
                <path d="M26 40 L54 24 L26 24 Z" fill="#2563eb" opacity="0.3"/>
            </svg>

            <div class="brand-content">
                <div class="brand-icon-large">✂️</div>
                <h1 class="brand-title">智能面料计算<br>精准排料优化</h1>
                <p class="brand-subtitle">专业的服装行业面料用量计算解决方案<br>助力企业降本增效，提升核心竞争力</p>

                <div class="features-list">
                    <div class="feature-item">
                        <div class="feature-icon blue">📊</div>
                        <div class="feature-text">
                            <h4>智能算法引擎</h4>
                            <p>基于大数据的精确计算，误差率低于1%</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon pink">🎯</div>
                        <div class="feature-text">
                            <h4>CAD深度集成</h4>
                            <p>支持主流CAD格式，无缝对接生产流程</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon green">⚡</div>
                        <div class="feature-text">
                            <h4>极速响应体验</h4>
                            <p>毫秒级计算速度，提升工作效率300%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧登录区域 -->
        <div class="login-section">
            <div class="stitch-decoration"></div>

            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">✂️</div>
                    <h1>欢迎回来</h1>
                    <p>登录您的账户以继续使用</p>
                </div>

                <div id="error-message"></div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-input"
                                value="test"
                                placeholder="请输入用户名"
                                required
                                autocomplete="username"
                            >
                            <span class="input-icon">👤</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input"
                                value="Fabric@2026"
                                placeholder="请输入密码"
                                required
                                autocomplete="current-password"
                            >
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn-login">
                        登 录
                    </button>

                    <div class="default-hint">
                        💡 <strong>默认测试账号</strong><br>
                        用户名：<strong>test</strong><br>
                        密码：<strong>Fabric@2026</strong>
                    </div>
                </form>

                <div class="login-footer">
                    © 2026 面料用量快速计算系统 · 专业版
                </div>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');
            
            errorDiv.innerHTML = '';
            
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const redirectUrl = sessionStorage.getItem('redirect_after_login') || '/';
                    sessionStorage.removeItem('redirect_after_login');
                    window.location.href = redirectUrl;
                } else {
                    showError(data.message || '登录失败');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                }
            } catch (error) {
                showError('网络错误，请重试');
                console.error('Login error:', error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
        }
        
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
