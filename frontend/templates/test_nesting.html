<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>排料图诊断测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        #calc-nesting-viewer { min-height: 400px; border: 2px solid #e0e0e0; border-radius: 8px; padding: 20px; background: #fafafa; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .log { margin: 10px 0; padding: 8px; border-left: 3px solid #3b82f6; background: #eff6ff; }
        .error { border-left-color: #ef4444; background: #fef2f2; }
        .success { border-left-color: #22c55e; background: #f0fdf4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 排料图渲染诊断</h1>
        
        <button onclick="testAPI()" style="padding: 12px 24px; font-size: 16px; cursor: pointer;">
            🚀 测试排料图渲染
        </button>

        <h2 style="margin-top: 30px;">控制台日志</h2>
        <div id="logs"></div>

        <h2 style="margin-top: 30px;">排料图容器 (id="calc-nesting-viewer")</h2>
        <div id="calc-nesting-viewer">等待加载...</div>
    </div>

    <!-- 加载与正式环境相同的脚本 -->
    <script src="/static/js/common.js"></script>
    <script type="module" src="/static/js/bundle.js"></script>
    
    <script>
        function log(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').appendChild(div);
            console.log(`[诊断测试] ${msg}`);
        }

        async function testAPI() {
            document.getElementById('logs').innerHTML = '';
            document.getElementById('calc-nesting-viewer').innerHTML = '<p>加载中...</p>';

            try {
                log('开始调用 /api/calc/all...');
                
                const resp = await fetch('/api/calc/all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        measurements: {
                            category: "tshirt",
                            fabricWidth: 145,
                            seamAllowance: 1.0,
                            pieces: [
                                {name: "前片", width: 50, height: 70, quantity: 1},
                                {name: "后片", width: 60, height: 76, quantity: 1},
                                {name: "袖子", width: 22, height: 62, quantity: 2}
                            ]
                        },
                        fabricWidth: 145,
                        seamAllowance: 1
                    })
                });

                const result = await resp.json();
                log(`API响应成功: ${result.success}`, result.success ? 'success' : 'error');

                if (!result.success) {
                    log(`错误: ${result.message}`, 'error');
                    return;
                }

                // 模拟 app.js 的逻辑
                const pattern = result.pattern || {};
                const nesting = result.nesting || {};

                log(`nesting.svg 存在: ${!!nesting.svg}, 长度: ${(nesting.svg || '').length}`);
                log(`nesting.pieces 数量: ${(nesting.pieces || []).length}`);
                log(`nesting.nestPositions 数量: ${(nesting.nestPositions || []).length}`);

                // 条件判断
                if (nesting.svg && (nesting.pieces || nesting.nestPositions) && 
                    ((nesting.pieces || []).length > 0 || (nesting.nestPositions || []).length > 0)) {
                    
                    log('✅ IF条件通过，开始构建数据...', 'success');

                    const fabricWidth = 145;
                    const patternPieces = pattern.pieces || [];
                    
                    const resultForCAD = {
                        pieces: (nesting.pieces || []).map(p => {
                            const patternPiece = patternPieces.find(pp => pp.name === p.name);
                            return {
                                name: p.name,
                                pathOps: patternPiece?.pathOps || [],
                                cutCount: 1,
                                onFold: p.onFold || false,
                                area: p.dimensions?.width * p.dimensions?.height || 0
                            };
                        }),
                        positions: (nesting.nestPositions || []).map(pos => ({
                            name: pos.pieceName,
                            x: pos.x,
                            y: pos.y,
                            rotation: pos.rotation || 0,
                            width: pos.width,
                            height: pos.height
                        })),
                        utilization_rate: nesting.fabricInfo?.utilization || 0,
                        bounds: {
                            width: fabricWidth,
                            height: nesting.fabricInfo?.height || 135
                        },
                        totalArea: fabricWidth * (nesting.fabricInfo?.height || 135),
                        usedArea: fabricWidth * (nesting.fabricInfo?.height || 135) * (nesting.fabricInfo?.utilization || 0) / 100,
                        nesting_svg: nesting.svg
                    };

                    log(`构建完成: pieces=${resultForCAD.pieces.length}, positions=${resultForCAD.positions.length}`);

                    // 调用渲染函数
                    log('准备调用 renderCalcNestingWithReact...');
                    
                    if (typeof window.renderNestingResult === 'function') {
                        log('✅ window.renderNestingResult 已定义!', 'success');
                        
                        try {
                            // 提取pieces给React
                            const reactPieces = resultForCAD.pieces.map(p => ({
                                name: p.name,
                                points: [],
                                pathOps: p.pathOps,
                                cutCount: p.cutCount,
                                onFold: p.onFold,
                                area: p.area
                            }));

                            const nestingResult = {
                                pieces: resultForCAD.pieces,
                                positions: resultForCAD.positions,
                                utilization: resultForCAD.utilization_rate,
                                bounds: resultForCAD.bounds,
                                totalArea: resultForCAD.totalArea,
                                usedArea: resultForCAD.usedArea
                            };

                            log(`调用 window.renderNestingResult(reactPieces数量=${reactPieces.length})...`);
                    
                    // 🔧 关键修复：临时替换容器ID
                    const calcContainer = document.getElementById('calc-nesting-viewer');
                    let originalId = null;
                    if (calcContainer) {
                        originalId = calcContainer.id;
                        calcContainer.id = 'cad-nesting-viewer';
                        log(`🔧 容器ID临时替换: ${originalId} → cad-nesting-viewer`, 'success');
                    }
                    
                    try {
                        window.renderNestingResult(reactPieces, nestingResult, fabricWidth);
                        log('✅ React渲染成功！', 'success');
                    } catch (err) {
                        log(`❌ React渲染错误: ${err.message}`, 'error');
                        throw err;
                    } finally {
                        // 恢复ID
                        if (calcContainer && originalId) {
                            const containerAfterRender = document.getElementById('cad-nesting-viewer');
                            if (containerAfterRender) {
                                containerAfterRender.id = originalId;
                            }
                            log(`🔧 容器ID已恢复: ${originalId}`, 'success');
                        }
                    }
                            
                            // 检查容器内容
                            setTimeout(() => {
                                const container = document.getElementById('calc-nesting-viewer');
                                const html = container.innerHTML;
                                log(`容器内容长度: ${html.length}`);
                                log(`包含SVG: ${html.includes('<svg')}`);
                                log(`包含canvas: ${html.includes('<canvas')}`);
                                
                                if (html.includes('<svg') || html.includes('canvas')) {
                                    log('✅ 排料图已渲染到DOM!', 'success');
                                } else {
                                    log('⚠️ 容器中未找到SVG或Canvas元素', 'error');
                                    log(`容器HTML预览: ${html.substring(0, 200)}...`, 'error');
                                }
                            }, 500);

                        } catch (err) {
                            log(`❌ React渲染错误: ${err.message}`, 'error');
                            log(`堆栈: ${err.stack}`, 'error');
                        }

                    } else {
                        log('❌ window.renderNestingResult 未定义! React组件未加载', 'error');
                        log('使用SVG回退模式...', 'error');
                        
                        const container = document.getElementById('calc-nesting-viewer');
                        container.innerHTML = `
                            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
                                <div style="max-width:100%;overflow:auto;border:1px solid #e0e0e0;border-radius:4px;padding:10px;background:#fafafa;">
                                    ${resultForCAD.nesting_svg}
                                </div>
                                <span style="color:#f59e0b;font-size:12px;">⚠️ SVG回退模式</span>
                            </div>
                        `;
                        log('SVG回退完成', 'success');
                    }

                } else {
                    log('❌ IF条件未通过! 会显示"暂无排料数据"', 'error');
                    document.getElementById('calc-nesting-viewer').innerHTML = 
                        '<p style="color:red;text-align:center;padding:40px;">暂无排料数据</p>';
                }

            } catch (error) {
                log(`❌ 测试失败: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // 页面加载完成后自动运行
        window.addEventListener('load', () => {
            log('页面加载完成');
            log(`window.renderNestingResult 类型: ${typeof window.renderNestingResult}`);
            
            // 延迟1秒确保bundle.js加载完毕
            setTimeout(() => {
                log(`延迟1秒后检查: window.renderNestingResult 类型: ${typeof window.renderNestingResult}`);
            }, 1000);
        });
    </script>
</body>
</html>
