<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精确计算 - 面料用量计算系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% set active_page = 'quick' %}
    {% include 'includes/navbar.html' %}

    <main class="container">
        <div class="page-header">
            <h2>🎯 精确排料计算</h2>
            <p class="page-desc">基于工业级矩形排料引擎，精确计算裁片、缝份、用料和利用率。</p>
        </div>

        <div class="two-column">
            <!-- 左侧：输入 -->
            <div class="column">
                <div class="card">
                    <h3>服装信息</h3>
                    <div class="form-group">
                        <label>服装品类</label>
                        <select id="q-category" onchange="loadCategoryTemplate()">
                            <option value="">-- 请选择品类 --</option>
                            <option value="tshirt">T恤</option>
                            <option value="shirt">衬衫</option>
                            <option value="jacket">夹克</option>
                            <option value="coat">大衣</option>
                            <option value="pants">裤子</option>
                            <option value="skirt">裙子</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <h3>面料参数</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>面料门幅 (cm)</label>
                            <input type="number" id="q-fabric-width" value="145" step="1" min="60" max="300">
                        </div>
                        <div class="form-group">
                            <label>缝份宽度 (cm)</label>
                            <input type="number" id="q-seam-allowance" value="1.0" step="0.5" min="0.5" max="3">
                        </div>
                        <div class="form-group">
                            <label>面料克重 (g/m²)</label>
                            <input type="number" id="q-fabric-weight" value="300" step="10" min="0">
                            <span class="form-hint">留空则不计算重量</span>
                        </div>
                        <div class="form-group">
                            <label>订单数量 (件)</label>
                            <input type="number" id="q-quantity" value="1" step="1" min="1">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>裁片列表 <button class="btn btn-small btn-secondary" onclick="addPiece()" style="margin-left:10px;">+ 添加</button></h3>
                    <table class="data-table" id="pieces-table">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>宽(cm)</th>
                                <th>高(cm)</th>
                                <th>数量</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="pieces-tbody">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>

                <button class="btn btn-primary btn-large btn-block" onclick="calculateNesting()">
                    🚀 开始计算
                </button>
            </div>

            <!-- 右侧：结果 -->
            <div class="column">
                <!-- 基本信息 -->
                <div class="card" id="result-info-card" style="display:none;margin-bottom:20px;">
                    <h3>📋 计算结果</h3>
                    <div id="result-info-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 24px;">
                    </div>
                </div>

                <!-- 材料汇总 -->
                <div class="card" id="result-material-card" style="display:none;margin-bottom:20px;">
                    <h3>📦 材料汇总</h3>
                    <div id="result-material-content"></div>
                </div>

                <!-- 裁片明细 -->
                <div class="card" id="result-pieces-card" style="display:none;margin-bottom:20px;">
                    <h3>✂️ 裁片明细</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>尺寸</th>
                                <th>含缝份</th>
                                <th>数量</th>
                                <th>面积</th>
                            </tr>
                        </thead>
                        <tbody id="result-pieces-tbody"></tbody>
                    </table>
                </div>

                <!-- 精确计算三个模块 -->
                <div id="calc-modules-container" style="display:flex;flex-direction:column;gap:20px;">
                    <!-- 裁片图 -->
                    <div class="card" id="calc-pattern-card" style="display:none;">
                        <h3>🎯 裁片图</h3>
                        <div id="calc-pattern-svg" style="text-align:center;padding:10px;background:#fafafa;border-radius:8px;overflow-x:auto;"></div>
                    </div>

                    <!-- 缝份图 -->
                    <div class="card" id="calc-seam-card" style="display:none;">
                        <h3>🧵 缝份图</h3>
                        <div id="calc-seam-svg" style="text-align:center;padding:10px;background:#fafafa;border-radius:8px;overflow-x:auto;"></div>
                    </div>

                    <!-- 排料图 -->
                    <div class="card" id="calc-nesting-card" style="display:none;">
                        <h3>📐 排料图</h3>
                        <div id="calc-nesting-svg" style="text-align:center;padding:10px;background:#fafafa;border-radius:8px;overflow-x:auto;"></div>
                        <div id="calc-nesting-stats" style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="loading-overlay" id="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">计算中...</div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/quick-calc.js"></script>
</body>
</html>
