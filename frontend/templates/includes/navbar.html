<script>
    (function () {
        try {
            var slot = document.querySelector('.nav-auth-slot');
            var raw = localStorage.getItem('auth_user_info');
            var cacheTime = parseInt(localStorage.getItem('auth_cache_time') || '0', 10);
            if (!slot || !raw || Date.now() - cacheTime > 30 * 60 * 1000) return;

            var user = JSON.parse(raw);
            var name = user && (user.nickname || user.username);
            if (!name) return;

            slot.className = 'nav-link nav-user-link nav-auth-slot auth-element';
            slot.href = '/profile';
            slot.setAttribute('aria-label', '个人中心');
            slot.innerHTML = '<span class="nav-user-icon">👤</span><span class="nav-user-name"></span>';
            slot.querySelector('.nav-user-name').textContent = name;
        } catch (e) {}
    })();
</script>
