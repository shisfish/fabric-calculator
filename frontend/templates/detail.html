<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算详情 - 面料用量快速计算系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% set active_page = 'history' %}
    {% include 'includes/navbar.html' %}

    <main class="container detail-page">
        <div class="result-actions-bar detail-actions" id="top-actions" style="display:none;">
            <a href="/history" class="btn btn-secondary" id="btn-back-history">← 返回历史记录</a>
            <button class="btn btn-primary" id="btn-edit" style="display:none;" onclick="editRecord()">✎ 返回修改</button>
            <button class="btn btn-outline" id="btn-export" style="display:none;" onclick="exportDetailResult()">⇩ 导出结果</button>
            <button class="btn btn-primary" id="btn-quotation" style="display:none;" onclick="goToQuotationFromDetail()">￥ 生成报价单</button>
        </div>

        <div class="page-header detail-header">
            <h2 id="detail-title">计算详情</h2>
            <p class="page-desc" id="detail-subtitle">正在加载...</p>
        </div>

        <div id="loading-state" class="detail-state">
            <div class="loading-spinner"></div>
            <div style="color:var(--text-secondary);margin-top:12px;">正在加载计算详情...</div>
        </div>

        <div id="error-state" class="detail-state" style="display:none;">
            <div style="font-size:40px;margin-bottom:12px;">!</div>
            <p style="color:var(--text-secondary);" id="error-msg">记录不存在或加载失败</p>
            <a href="/history" class="btn btn-primary" style="margin-top:16px;">返回历史记录</a>
        </div>

        <div id="detail-content" style="display:none;"></div>
    </main>

    <div class="loading-overlay" id="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        const RECORD_ID = '{{ record_id }}';
    </script>
    <script src="/static/js/auth.js?v=20260603a"></script>
    <script src="/static/js/common.js?v=20260603a"></script>
    <script src="/static/js/result-view.js?v=20260603a"></script>
    <script src="/static/js/detail.js?v=20260603c"></script>
</body>
</html>
