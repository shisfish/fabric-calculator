<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算详情 - 面料用量快速计算系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% set active_page = 'history' %}
    {% include 'includes/navbar.html' %}

    <main class="container detail-page">
        <div class="result-actions-bar detail-actions" id="top-actions" style="display:none;">
            <a href="/history" class="btn btn-secondary" id="btn-back-history">← 返回历史记录</a>
            <button class="btn btn-primary" id="btn-edit" style="display:none;" onclick="editRecord()">✎ 返回修改</button>
            <button class="btn btn-outline" id="btn-export" style="display:none;" onclick="exportDetailResult()">⇩ 导出结果</button>
            <button class="btn btn-primary" id="btn-quotation" style="display:none;" onclick="goToQuotationFromDetail()">￥ 生成报价单</button>
        </div>

        <div class="page-header detail-header">
            <h2 id="detail-title">计算详情</h2>
            <p class="page-desc" id="detail-subtitle">正在加载...</p>
        </div>

        <div id="loading-state" class="detail-state">
            <div class="loading-spinner"></div>
            <div style="color:var(--text-secondary);margin-top:12px;">正在加载计算详情...</div>
        </div>

        <div id="error-state" class="detail-state" style="display:none;">
            <div style="font-size:40px;margin-bottom:12px;">!</div>
            <p style="color:var(--text-secondary);" id="error-msg">记录不存在或加载失败</p>
            <a href="/history" class="btn btn-primary" style="margin-top:16px;">返回历史记录</a>
        </div>

        <div id="detail-content" style="display:none;">
            <div class="card detail-card">
                <h3>📋 基本信息</h3>
                <div class="detail-info-grid" id="info-grid"></div>
            </div>

            <div class="section" id="summary-section">
                <h3>📊 结果概览</h3>
                <div class="result-cards" id="summary-cards"></div>
            </div>

            <div class="section" id="materials-section">
                <h3>📦 材料分类汇总</h3>
                <div id="material-cards" class="detail-material-list"></div>
            </div>

            <div class="section" id="images-section">
                <h3>🖼 图形展示</h3>
                <div id="piece-images"></div>
                <div id="seam-images"></div>
                <div id="nesting-images"></div>
            </div>

            <div class="section" id="nesting-data-section">
                <h3>📐 排料数据</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>材料</th>
                                <th>单件用料</th>
                                <th>净长度</th>
                                <th>面积</th>
                                <th>利用率</th>
                                <th>裁片数</th>
                            </tr>
                        </thead>
                        <tbody id="nesting-data-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="section" id="pieces-section">
                <h3>✂ 裁片明细</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>裁片名称</th>
                                <th>原始尺寸(cm)</th>
                                <th>含缝份尺寸(cm)</th>
                                <th>数量</th>
                                <th>面积(cm²)</th>
                                <th>材料</th>
                            </tr>
                        </thead>
                        <tbody id="pieces-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="loading-overlay" id="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        const RECORD_ID = '{{ record_id }}';
    </script>
    <script src="/static/js/auth.js?v=20260603a"></script>
    <script src="/static/js/common.js?v=20260603a"></script>
    <script src="/static/js/detail.js?v=20260603b"></script>
</body>
</html>
