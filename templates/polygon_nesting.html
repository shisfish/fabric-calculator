<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多边形排料 - 面料用量计算系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .polygon-canvas {
            border: 1px solid #ddd;
            background: #f8f9fa;
            margin: 10px 0;
        }
        .piece-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .piece-item .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .piece-item .form-group {
            flex: 1;
        }
        .piece-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .piece-item input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .color-picker {
            width: 50px;
            height: 34px;
            border: none;
            cursor: pointer;
        }
        .add-piece-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .add-piece-btn:hover {
            background: #0056b3;
        }
        .remove-piece-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .remove-piece-btn:hover {
            background: #c82333;
        }
        .result-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .nesting-canvas {
            border: 2px solid #333;
            background: #fff;
            margin-top: 15px;
        }
        .canvas-container {
            overflow-x: auto;
            max-width: 100%;
        }
    </style>
</head>
<body>
    {% set active_page = 'polygon_nesting' %}
    {% include 'includes/navbar.html' %}
    
    <div class="container">
        <h2>多边形排料</h2>
        <p class="description">支持任意多边形裁片的精确排料，使用分离轴定理进行碰撞检测</p>
        
        <div class="row">
            <div class="col-md-6">
                <h3>裁片设置</h3>
                
                <div id="pieces-container">
                    <!-- 示例裁片 -->
                    <div class="piece-item" data-index="0">
                        <div class="form-row">
                            <div class="form-group">
                                <label>裁片名称</label>
                                <input type="text" class="piece-name" value="前片">
                            </div>
                            <div class="form-group">
                                <label>颜色</label>
                                <input type="color" class="piece-color" value="#007bff" class="color-picker">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>宽度 (cm)</label>
                                <input type="number" class="piece-width" value="50" step="1">
                            </div>
                            <div class="form-group">
                                <label>高度 (cm)</label>
                                <input type="number" class="piece-height" value="65" step="1">
                            </div>
                            <div class="form-group">
                                <label>数量</label>
                                <input type="number" class="piece-count" value="2" min="1">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>切角类型</label>
                                <select class="piece-type">
                                    <option value="rectangle">矩形</option>
                                    <option value="single_corner" selected>单切角</option>
                                    <option value="double_corner">双切角</option>
                                </select>
                            </div>
                        </div>
                        <button class="remove-piece-btn">删除</button>
                    </div>
                    
                    <div class="piece-item" data-index="1">
                        <div class="form-row">
                            <div class="form-group">
                                <label>裁片名称</label>
                                <input type="text" class="piece-name" value="后片">
                            </div>
                            <div class="form-group">
                                <label>颜色</label>
                                <input type="color" class="piece-color" value="#28a745" class="color-picker">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>宽度 (cm)</label>
                                <input type="number" class="piece-width" value="50" step="1">
                            </div>
                            <div class="form-group">
                                <label>高度 (cm)</label>
                                <input type="number" class="piece-height" value="65" step="1">
                            </div>
                            <div class="form-group">
                                <label>数量</label>
                                <input type="number" class="piece-count" value="2" min="1">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>切角类型</label>
                                <select class="piece-type">
                                    <option value="rectangle" selected>矩形</option>
                                    <option value="single_corner">单切角</option>
                                    <option value="double_corner">双切角</option>
                                </select>
                            </div>
                        </div>
                        <button class="remove-piece-btn">删除</button>
                    </div>
                </div>
                
                <button class="add-piece-btn" onclick="addPiece()">添加裁片</button>
                
                <div class="form-group" style="margin-top: 15px;">
                    <label>面料门幅 (cm)</label>
                    <input type="number" id="fabric-width" value="140" step="1">
                </div>
                
                <button class="btn btn-primary" onclick="calculateNesting()" style="margin-top: 15px;">
                    开始排料
                </button>
            </div>
            
            <div class="col-md-6">
                <div class="result-section">
                    <h3>排料结果</h3>
                    <div id="result-summary">
                        <div class="result-row">
                            <span>总用料长度:</span>
                            <span id="total-length">-</span>
                        </div>
                        <div class="result-row">
                            <span>门幅利用率:</span>
                            <span id="utilization">-</span>
                        </div>
                    </div>
                    <div class="canvas-container">
                        <canvas id="nesting-canvas" class="nesting-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let pieceIndex = 2;
        
        function addPiece() {
            const container = document.getElementById('pieces-container');
            const newPiece = document.createElement('div');
            newPiece.className = 'piece-item';
            newPiece.dataset.index = pieceIndex++;
            
            newPiece.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>裁片名称</label>
                        <input type="text" class="piece-name" value="裁片${pieceIndex}">
                    </div>
                    <div class="form-group">
                        <label>颜色</label>
                        <input type="color" class="piece-color" value="${getRandomColor()}" class="color-picker">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>宽度 (cm)</label>
                        <input type="number" class="piece-width" value="40" step="1">
                    </div>
                    <div class="form-group">
                        <label>高度 (cm)</label>
                        <input type="number" class="piece-height" value="50" step="1">
                    </div>
                    <div class="form-group">
                        <label>数量</label>
                        <input type="number" class="piece-count" value="1" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>切角类型</label>
                        <select class="piece-type">
                            <option value="rectangle" selected>矩形</option>
                            <option value="single_corner">单切角</option>
                            <option value="double_corner">双切角</option>
                        </select>
                    </div>
                </div>
                <button class="remove-piece-btn">删除</button>
            `;
            
            container.appendChild(newPiece);
            bindRemoveButtons();
        }
        
        function bindRemoveButtons() {
            document.querySelectorAll('.remove-piece-btn').forEach(btn => {
                btn.onclick = function() {
                    this.parentElement.remove();
                };
            });
        }
        
        function getRandomColor() {
            const colors = ['#007bff', '#28a745', '#dc3545', '#ffc107', '#17a2b8', '#6f42c1'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        function generateVertices(width, height, type) {
            const w = width;
            const h = height;
            
            switch(type) {
                case 'single_corner':
                    // 左上角切角
                    return [
                        [0, 0],
                        [w, 0],
                        [w, h],
                        [w * 0.2, h],
                        [0, h * 0.8]
                    ];
                case 'double_corner':
                    // 左上角和右上角都切角
                    return [
                        [0, 0],
                        [w, 0],
                        [w, h * 0.8],
                        [w * 0.8, h],
                        [w * 0.2, h],
                        [0, h * 0.8]
                    ];
                default:
                    // 矩形
                    return [
                        [0, 0],
                        [w, 0],
                        [w, h],
                        [0, h]
                    ];
            }
        }
        
        async function calculateNesting() {
            const pieces = [];
            const fabricWidth = parseFloat(document.getElementById('fabric-width').value);
            
            document.querySelectorAll('.piece-item').forEach((item, idx) => {
                const name = item.querySelector('.piece-name').value;
                const width = parseFloat(item.querySelector('.piece-width').value);
                const height = parseFloat(item.querySelector('.piece-height').value);
                const count = parseInt(item.querySelector('.piece-count').value);
                const type = item.querySelector('.piece-type').value;
                const color = item.querySelector('.piece-color').value;
                
                const vertices = generateVertices(width, height, type);
                
                for(let i = 0; i < count; i++) {
                    pieces.push({
                        name: `${name}${i + 1}`,
                        vertices: vertices,
                        width: width,
                        height: height,
                        color: color
                    });
                }
            });
            
            const response = await fetch('/api/polygon-nesting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pieces: pieces,
                    fabric_width: fabricWidth
                })
            });
            
            const result = await response.json();
            
            if(result.success) {
                displayResult(result.data, fabricWidth);
            } else {
                alert('排料失败: ' + result.message);
            }
        }
        
        function displayResult(data, fabricWidth) {
            document.getElementById('total-length').textContent = 
                `${data.total_length_cm.toFixed(2)} cm`;
            document.getElementById('utilization').textContent = 
                `${(data.width_utilization * 100).toFixed(2)}%`;
            
            drawNesting(data.rows, fabricWidth);
        }
        
        function drawNesting(rows, fabricWidth) {
            const canvas = document.getElementById('nesting-canvas');
            const ctx = canvas.getContext('2d');
            
            const scale = 3; // 缩放比例
            const padding = 20;
            
            const totalHeight = rows.reduce((sum, row) => sum + row.length_cm, 0);
            
            canvas.width = fabricWidth * scale + padding * 2;
            canvas.height = totalHeight * scale + padding * 2;
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 0.5;
            for(let x = 0; x <= fabricWidth; x += 10) {
                ctx.beginPath();
                ctx.moveTo(padding + x * scale, padding);
                ctx.lineTo(padding + x * scale, padding + totalHeight * scale);
                ctx.stroke();
            }
            for(let y = 0; y <= totalHeight; y += 10) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + y * scale);
                ctx.lineTo(padding + fabricWidth * scale, padding + y * scale);
                ctx.stroke();
            }
            
            // 绘制面料边界
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(padding, padding, fabricWidth * scale, totalHeight * scale);
            
            let currentY = padding;
            
            // 绘制裁片
            rows.forEach(row => {
                row.pieces.forEach(piece => {
                    ctx.fillStyle = piece.color || '#007bff';
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    
                    piece.vertices.forEach((v, i) => {
                        const x = padding + (piece.x + v[0]) * scale;
                        const y = currentY + (piece.y + v[1]) * scale;
                        if(i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    
                    // 绘制裁片名称
                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    
                    const centerX = padding + piece.x * scale + piece.width * scale / 2;
                    const centerY = currentY + piece.y * scale + piece.height * scale / 2;
                    
                    ctx.strokeText(piece.name, centerX, centerY);
                    ctx.fillText(piece.name, centerX, centerY);
                });
                
                currentY += row.length_cm * scale;
            });
        }
        
        bindRemoveButtons();
    </script>
</body>
</html>
